<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Arshak Khoshnevis">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Garden</title>
    <link rel="icon" href="{{ url_for('static', filename='blueberries.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='Home.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="username">Welcome {{ session['username'] }}!</h1>
        </header>
        <main>
            <span class="rotate-message">Please rotate your phone to landscape mode!</span>
            <div class="garden">
                <form action="{{ url_for('logout') }}" method="post" class="logout-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="logout">EXIT</button>
                </form>
                <div class="garden-left">
                    <input id="checkbox-0" class="checkbox" type="checkbox" onclick="togglePump(0);">
                    <label class="switch" for="checkbox-0"><div class="powersign"></div></label>
                    <h1 class="moist" data-id="0">0%</h1>
                    <a href="#" class="hinfo">more</a>
                </div>
                <div class="garden-topl">
                    <input id="checkbox-1" class="checkbox" type="checkbox" onclick="togglePump(1);">
                    <label class="switch" for="checkbox-1"><div class="powersign"></div></label>
                    <h1 class="moist" data-id="1">0%</h1>
                    <a href="#" class="hinfo">more</a>
                </div>
                <div class="garden-topr">
                    <input id="checkbox-2" class="checkbox" type="checkbox" onclick="togglePump(2);">
                    <label class="switch" for="checkbox-2"><div class="powersign"></div></label>
                    <h1 class="moist" data-id="2">0%</h1>
                    <a href="#" class="hinfo">more</a>
                </div>
                <div class="garden-right">
                    <input id="checkbox-3" class="checkbox" type="checkbox" onclick="togglePump(3);">
                    <label class="switch" for="checkbox-3"><div class="powersign"></div></label>
                    <h1 class="moist" data-id="3">0%</h1>
                    <a href="#" class="hinfo">more</a>
                </div>
                <div class="info">
                    <div class="info-content">
                        <h1 class="infoMoist">Moisture: <span>0%</span></h1>
                        <details>
                            <summary>Last Time</summary>
                            <h1 class="infoLastTime">Last irrigation: No recorded watering</h1>
                            <h1 class="infoLastTime">Duration: --</h1>
                        </details>
                        <details>
                            <summary>Set time</summary>
                            <h1>time</h1>
                        </details>
                        <h1 class="infoPumpState">Pump is: <span class="off">off</span></h1>
                    </div>
                    <div class="info-footer">
                        <h1 class="infoDate"></h1>
                        <h1 class="infoTime"></h1>
                    </div>
                </div>
                <div class="logs">
                    <details>
                        <summary id="device-status">ESP32: waiting for first heartbeat</summary>
                        <pre id="esp32-log" aria-live="polite">Waiting for ESP32 data…</pre>
                    </details>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='Home.js') }}"></script>
</body>
</html>
